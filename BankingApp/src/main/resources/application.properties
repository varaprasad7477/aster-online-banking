spring.application.name=Aster Banking
server.port=${PORT:8080}

# A file-backed local database makes the portfolio demo work out of the box.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/asterbank;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Configure SMTP only if password reset email delivery is needed.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
management.health.mail.enabled=false

app.demo.enabled=${DEMO_ENABLED:true}
app.jwt.secret=${JWT_SECRET:}
